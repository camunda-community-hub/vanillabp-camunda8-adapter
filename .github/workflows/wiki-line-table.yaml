name: Wiki line table
# The release-line table of the wiki is written from the POM, it is not maintained.
#
# Renovate moves the client pins of pom.xml and knows nothing about the wiki, so Home.md
# went three bumps stale before somebody read it. The wiki is a repository of its own
# without pull requests, so a check on a pull request could only report a page nobody can
# fix in that pull request. This writes the page instead, right after the pin landed on
# main.
#
# Only the block between the two markers is touched, and only when the POM says something
# else than the page does. A run which finds them agreeing pushes nothing.
"on":
  push:
    branches:
      - main
    paths:
      - pom.xml
      - bin/wiki-line-table.sh
      - .github/workflows/wiki-line-table.yaml
  workflow_dispatch:
permissions:
  contents: read
env:
  # The wiki a reader opens is the one of the community-hub repository, which is where
  # every link of the README points. It is NOT the wiki of this repository, so the token
  # of this workflow run cannot write it and VANILLABP_USER_TOKEN is used instead. A token
  # which cannot push turns this job red on main, which is the right noise: the page would
  # otherwise go on saying a pin nobody publishes any more.
  WIKI: camunda-community-hub/vanillabp-camunda8-adapter.wiki.git
concurrency:
  # Two pushes to the wiki at once would race for the same page, and the later run holds
  # the newer POM, so the older one is the one to drop.
  group: wiki-line-table
  cancel-in-progress: false
jobs:
  write-the-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone the wiki
        run: git clone
          "https://${{ secrets.VANILLABP_USER_NAME }}:${{ secrets.VANILLABP_USER_TOKEN }}@github.com/$WIKI"
          wiki
      - name: Write the table and push it if it moved
        run: |
          set -euo pipefail
          # 0 the page agrees with the POM, 1 it does not, anything else the script could
          # not tell - and a run which cannot tell has to go red rather than push
          status=0
          bin/wiki-line-table.sh --check wiki/Home.md || status=$?
          case "$status" in
            0)
              echo "The wiki already says what the POM pins."
              exit 0
              ;;
            1) ;;
            *) exit "$status" ;;
          esac
          bin/wiki-line-table.sh wiki/Home.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Home.md
          git commit -m "docs: the release-line table follows the client pins of ${GITHUB_SHA:0:7}"
          git push
