name: Client API changes
# What a Camunda 8 client bump added to the classes, said on the pull request which raises
# the pin.
#
# Camunda does not count a new enum literal or a new interface method as breaking, so
# neither is documented, not even between two patches of one line. Both break us, and a
# patch of a pin merges itself once the checks pass, so without this the change nobody
# documents is also the change nobody reads.
#
# It is written once and called from businesscockpit-camunda8-adapter, which compiles
# against the same client.
#
# Nothing here hands the caller's project to Maven. This job has no token for GitHub
# Packages, and the caller imports the VanillaBP BOM as a snapshot from there, so Maven
# would stop at the import and never reach a property. Everything this needs out of a POM
# is read from the text.
#
# What selects a pull request is the pin itself and not the 'camunda8-line-pin' label
# Renovate adds. The label exists in this repository only: the cockpit adapter has
# io.camunda switched off in its Renovate configuration and raises its pins by hand, so
# there is no label there to key on. checks.yaml reads the same property when it says in its
# log whether a pull request moves a pin, so the two cannot disagree. A pull request which
# moves no pin ends in the first step.
"on":
  workflow_call:
  pull_request:
    # 'labeled' stood here as well, so that a Renovate pull request which gets its label
    # after it was opened still runs this. It was never needed: what selects a pull
    # request is the pin in the POM, see above, and the pin is there from the first
    # commit. What the trigger did do was start this once per label, and Renovate adds
    # several: the pull request which raised the 8.8 pin in September 2026 ran this four
    # times for one commit, and the four runs raced over the comment below.
    types: [opened, synchronize]
concurrency:
  # One run of this per pull request, and the newest run wins. An older run answers about
  # a commit nobody will merge, and two runs at once used to write the comment twice:
  # each of them looks for a comment of its own to rewrite, and at that moment neither
  # comment is there yet.
  #
  # This group cancels, and the publish group of deploy-to-github-packages.yaml does not.
  # What that one protects is work which cannot be repeated, a snapshot half uploaded.
  # The work here is an answer about one commit. The newest run is never the one that is
  # cancelled, so the pull request always ends up with an answer, and with the answer for
  # the commit somebody is about to merge.
  #
  # A caller in another repository may be grouped along with it, because a called
  # workflow runs inside the caller's run, and GitHub documents nothing about what a
  # group written here does there. Either way it costs nothing:
  # businesscockpit-camunda8-adapter calls this from a workflow which holds this one job
  # and nothing else, so a run cancelled there loses a repeat of this answer and the
  # newer run gives it again.
  group: client-api-changes-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  client-api-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is read for the version the pin had before. A pull request is
          # checked out as the merge commit, so its first parent is the base branch and
          # 'HEAD^1:pom.xml' is the POM the pin moved away from. Two commits are all that
          # needs to arrive for that. This cloned every commit the repository has to read
          # one file, and it did so once per caller as well.
          fetch-depth: 2
      - name: The scripts and the release lines of the adapter repository
        # they live in the adapter repository. A pull request THERE brings its own copy,
        # and that copy is the one which runs: a change to a script may not be checked by
        # the version it replaces. A caller gets the POM along with them, and that POM is
        # where the release lines are written down.
        if: hashFiles('bin/client-api-changes.sh') == ''
        uses: actions/checkout@v7
        with:
          repository: camunda-community-hub/vanillabp-camunda8-adapter
          path: .camunda8-adapter
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin
          cache: maven
      - id: report
        name: What this bump added to the classes
        # The pins are the camunda8.version.line-* properties of the parent POM, so this
        # cannot fall behind the build. Only a property whose VALUE changed counts: a pull
        # request which moves the line 8.9 pin says nothing about 8.8.
        run: |
          set -euo pipefail
          # The base is the first parent of the merge commit, and only a pull request is
          # checked out that way. A caller reaches this through 'workflow_call', which
          # keeps the event of the run it was called from, and the one caller there is
          # calls it on a pull request. A run started any other way has no base to hold
          # the pins against, so it says that and ends.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "A run which is not a pull request has no base commit, so nobody can be"
            echo "told here which pin moved."
            exit 0
          fi
          script=bin/client-api-changes.sh
          [ -x "$script" ] || script=.camunda8-adapter/bin/client-api-changes.sh
          # Which line is the preview one is read from the POM the script came with, see
          # bin/line-preview.sh. The lines are defined in this repository, and a caller
          # follows them, so the two scripts have to come out of the same checkout.
          line_preview="$(dirname "$script")/line-preview.sh"
          if [ ! -x "$line_preview" ]; then
            echo "${line_preview} is missing, so a find could not be sorted into a note or" >&2
            echo "a red check. It belongs next to ${script}." >&2
            exit 1
          fi

          pins() {
            sed -n 's|.*<\(camunda8\.version\.line-[^>]*\)>\([^<]*\)</.*|\1 \2|p' "$1"
          }
          git show "HEAD^1:pom.xml" > "${RUNNER_TEMP}/base-pom.xml"
          pins "${RUNNER_TEMP}/base-pom.xml" | sort > "${RUNNER_TEMP}/base-pins"
          pins pom.xml | sort > "${RUNNER_TEMP}/head-pins"

          report="${RUNNER_TEMP}/report.md"
          : > "$report"
          blocking=0
          while read -r property new_version; do
            old_version="$(awk -v p="$property" '$1 == p { print $2 }' "${RUNNER_TEMP}/base-pins")"
            if [ -z "$old_version" ] || [ "$old_version" = "$new_version" ]; then
              continue
            fi
            line="${property#camunda8.version.line-}"
            echo "== line ${line}: ${old_version} -> ${new_version}"
            status=0
            "$script" io.camunda:camunda-client-java "$old_version" "$new_version" \
              >> "$report" || status=$?
            [ $status -le 1 ] || exit $status
            echo >> "$report"
            if [ $status -eq 1 ]; then
              # An alpha rewrites its classes between two builds and is not on anybody's
              # cluster yet, so the preview line is told rather than blocked. The GA lines
              # are blocked, and that is the point: a red check is what takes the patch
              # automerge away from exactly the bumps this is about.
              #
              # A script which cannot read the flag leaves this step with its message in
              # the log. Asking Maven for the property looked shorter and hid the failure
              # in the variable, which turned the preview line into a GA line and the note
              # into a red check.
              preview="$("$line_preview" "$line")"
              if [ "$preview" = "true" ]; then
                echo "_Line ${line} is the preview line, so this is a note and not a red check._" >> "$report"
                echo >> "$report"
              else
                blocking=1
              fi
            fi
          done < "${RUNNER_TEMP}/head-pins"

          if [ ! -s "$report" ]; then
            echo "No client pin moves in this pull request."
          fi
          {
            echo "blocking=${blocking}"
            echo "report=${report}"
            [ -s "$report" ] && echo "says=yes" || echo "says=no"
          } >> "$GITHUB_OUTPUT"
          cat "$report"
      - name: Say it on the pull request
        if: steps.report.outputs.says == 'yes'
        env:
          GH_TOKEN: "${{ github.token }}"
          REPORT: "${{ steps.report.outputs.report }}"
          PULL_REQUEST: "${{ github.event.pull_request.number }}"
        # One comment which is rewritten, not a new one per push: Renovate pushes to a pin
        # pull request whenever it rebuilds the dependency dashboard.
        run: |
          set -euo pipefail
          marker="<!-- client-api-changes -->"
          body="${RUNNER_TEMP}/comment.md"
          printf '%s\n## What this client bump added\n\n' "$marker" > "$body"
          cat "$REPORT" >> "$body"
          existing="$(gh api "repos/${{ github.repository }}/issues/${PULL_REQUEST}/comments" \
            --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
          if [ -n "$existing" ]; then
            jq -Rs '{body: .}' < "$body" \
              | gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${existing}" --input -
          else
            jq -Rs '{body: .}' < "$body" \
              | gh api --method POST "repos/${{ github.repository }}/issues/${PULL_REQUEST}/comments" --input -
          fi
      - name: A GA line may not merge this unread
        run: |
          [ "${{ steps.report.outputs.blocking }}" = "1" ] || exit 0
          echo "This bump adds enum literals or interface methods on a GA line. Read the" >&2
          echo "comment on the pull request, check every place which compares against one" >&2
          echo "literal or implements one of those interfaces, and merge by hand." >&2
          exit 1
