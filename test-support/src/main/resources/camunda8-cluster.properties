# Filtered by Maven from the release line this build activated. Do not
# write a version in here: the value comes from the Camunda client the line pins, so
# an integration test always meets the oldest cluster the built artifact claims.
cluster.image=${camunda8.cluster.image}
# Where that cluster keeps its secondary storage, and with it whether a test class pays
# for one container or two. It belongs to the line as much as the image does: a cluster
# which can hold the storage in a database of its own process needs nothing beside it.
cluster.secondary-storage=${camunda8.cluster.secondary-storage}
