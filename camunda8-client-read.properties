# The Camunda client each line was last READ against by a person. Nothing builds with these
# numbers. The pins are the camunda8.version.line-* properties of pom.xml.
#
# Camunda adds enum literals and interface methods inside a line and does not call that
# breaking. Both can break the adapter. So when a client bump on a GA line adds one,
# .github/workflows/client-api-changes.yaml makes the pull request red. It turns green when
# this file names the new version, or a newer one, for that line. Whoever read the
# additions raises the entry with one commit on the pull request's branch. That commit
# records who read what. See decision 86 in the repository's DECISIONS.md.
#
# A bump which adds nothing merges without a change here, so an entry may be older than
# its pin. One entry per line. A line joins and leaves here with its profile.
line-8.8=8.8.43
line-8.9=8.9.26
line-8.10=8.10.6
