spring:
  datasource:
    url: "jdbc:h2:file:${a895.data-directory:./data}/a895;AUTO_SERVER=FALSE"
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 2
logging:
  level:
    root: INFO
vanillabp:
  adapters:
    c8:
      type: camunda8
      rest-address: http://localhost:18080
      grpc-address: http://localhost:26500
      name-clash-avoidance: use-prefix
      job-lease: use
  prioritized-adapters:
    - c8
  workflow-modules:
    read-model-895:
      adapters:
        c8:
          resources-location: classpath*:analysis895
      workflows:
        ReadModelProcess:
          allow-full-sync-with-bpms: true
          declared-aggregate-values:
            - '*'
